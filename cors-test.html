<!DOCTYPE html>
<html>
<head>
    <title>StudySnap CORS Test</title>
</head>
<body>
    <h1>StudySnap CORS Test</h1>
    <button onclick="testBackend()">Test Backend Connection</button>
    <div id="result"></div>

    <script>
        async function testBackend() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('https://studysnap-app.onrender.com/health');
                const data = await response.json();
                resultDiv.innerHTML = `
                    <h3>✅ Backend Connected!</h3>
                    <p><strong>Status:</strong> ${data.status}</p>
                    <p><strong>Environment:</strong> ${data.environment}</p>
                    <p><strong>CORS:</strong> ${data.services.cors}</p>
                    <p><strong>OpenAI:</strong> ${data.services.openai}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ Connection Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>This means CORS is not fixed yet.</p>
                `;
            }
        }
    </script>
</body>
</html>
